version: 2.1

orbs:
  pnpm: rkesters/pnpm-release-management@x.y.z

jobs:
  build:
    executor: pnpm/default # uses a Docker image + pnpm logic baked in
    steps:
      - checkout
      - pnpm/install # pnpm install --frozen-lockfile + cache
      - pnpm/run:
          command: build
      - pnpm/run:
          command: test
      - pnpm/run:
          command: semantic-release || true
