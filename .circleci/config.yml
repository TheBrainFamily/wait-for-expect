version: 2.1

orbs:
  node: circleci/node@5.0.2

jobs:
  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: pnpm
      - run:
          name: Build project
          command: pnpm run build
      - run:
          name: Run tests
          command: pnpm test
      - run:
          name: Release
          command: pnpm run semantic-release || true

workflows:
  build_and_release:
    jobs:
      - build
